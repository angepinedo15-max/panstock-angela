.card{background:white;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.08)}

.btn-primary{background:#0F4C5C;color:white}.btn-sec{background:#FFF3E0;color:#E65100;border:1px solid #FFCC80}

.msg.ok{display:block;background:#E8F5E9;color:#2E7D32}.msg.err{display:block;background:#FFEBEE;color:#C62828}
.tabs{display:flex;background:white;border-radius:14px;padding:4px;margin:15px 0}
.tab{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer}
.tab.active{background:#0F4C5C;color:white}
.history-item{border-bottom:1px solid #eee;padding:8px 0;font-size:13px;display:flex;justify-content:space-between}
.footer{text-align:center;padding:20px;color:#888;font-size:11px}
