<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PanStock - Angela Pinedo</title>
<style>
body{font-family:sans-serif;background:#FFF8E8;margin:0;padding:15px}
.header{background:#0F4C5C;color:white;padding:20px;border-radius:15px;text-align:center}
.card{background:white;border-radius:15px;padding:15px;margin:15px 0;box-shadow:0 2px 6px #0002;border-left:5px solid #0F4C5C}
.btn{background:#0F4C5C;color:white;padding:12px;width:100%;border:none;border-radius:10px;font-size:16px}
.badge{background:#E8F5E9;padding:3px 8px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h2>PanStock v1.0</h2>
<p>Autora: Angela Pinedo - Panaderia 1 Sede</p>
</div>
<div class="card">
<b>Harina Trigo 25kg</b> <span class="badge">A1</span>
<p>Stock: 48 sacos</p>
<button class="btn">SACAR 5kg SIN ESCANER</button>
</div>
<div class="card">
<b>Mantequilla</b> <span class="badge">B2</span>
<p>Stock: 20 bloques</p>
</div>
</body>
</html>
